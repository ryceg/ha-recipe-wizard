[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-wizard"
version = "0.1.0"
description = "Structured recipe format and resolver for the Home Assistant Recipe Wizard"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["recipe_wizard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

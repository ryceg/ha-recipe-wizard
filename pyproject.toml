# Nothing here builds a wheel: HACS ships the integration by copying
# custom_components/recipe_wizard/ into the user's config directory. This file
# exists for the dev dependency and the pytest configuration.
[project]
name = "recipe-wizard"
version = "0.1.0"
description = "Structured recipe format and resolver for the Home Assistant Recipe Wizard"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

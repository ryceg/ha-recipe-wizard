# Where this integration stands against the Home Assistant quality scale.
#
# `manifest.json` deliberately does not declare `quality_scale`: Home Assistant
# reports every custom integration as "custom" regardless (see
# `loader.Integration.quality_scale`), so a declaration here would be a claim
# nothing checks. hassfest skips this file for custom integrations for the same
# reason, but the file is written to hassfest's real schema anyway -- every rule
# in every tier is listed, every exemption carries its reason, and nothing is
# blank -- so that it stays reviewable and would validate unchanged if this ever
# moved into core.
#
# Because hassfest skips it, nothing catches a duplicated key here: a merge once
# left seven rules stated twice, and YAML's last-one-wins quietly reinstated the
# older, shorter comment on four of them. Read a diff of this file as prose.
#
# The two structural ceilings, stated once so no rule below has to argue them:
#
# * There are no devices. The integration reads a directory of documents, so
#   every device and discovery rule is genuinely not applicable rather than
#   skipped, and `integration_type` is `service`.
# * The library is synchronous. `core/` is a stdlib-only resolver doing file I/O,
#   which is the right shape for something a CLI and an enrichment loop also use.
#   Every call from the integration goes through `hass.async_add_executor_job`,
#   and Platinum's `async-dependency` is the accepted price.
#
# Both platforms are in place -- the cook-along sensors and the shopping list --
# so the entity and action rules below are answered rather than deferred. One
# rule is left as `todo` and only one: brands needs an icon.png drawn and a pull
# request to an external repository.

rules:
  # --- Bronze ---------------------------------------------------------------
  action-setup:
    status: done
    comment: >-
      The four cook-along actions register in async_setup (actions.py, called from
      __init__.py), not async_setup_entry, so an automation calling one while the
      entry is retrying is told the entry is not loaded rather than that the action
      does not exist. Each handler resolves the one loaded entry itself.
  appropriate-polling:
    status: done
    comment: >-
      15 minutes. Recipes are added and enriched outside Home Assistant, so
      polling is what stops a new recipe needing a restart; the interval only
      stats the documents and parses solely when an mtime has moved
      (loader.library_fingerprint).
  brands:
    status: todo
    comment: >-
      Needs an icon.png and a pull request to home-assistant/brands. No asset has
      been invented for it.
  common-modules:
    status: done
    comment: >-
      The coordinator is in coordinator.py, shared loading in loader.py, and the
      base entity in entity.py -- which owns the unique-id scheme and the one
      service device, so neither platform invents its own.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: >-
      tests_ha/test_config_flow.py covers the form, the created entry, the
      relative-path case, each of the five error keys, recovery after an error,
      the single-entry abort, and every path through the reconfigure step.
  dependency-transparency:
    status: done
    comment: >-
      requirements is empty. The resolver is vendored at
      custom_components/recipe_wizard/core/ and is stdlib-only, so there is no
      third-party code to be transparent about. The manifest does name Home
      Assistant components: http as a dependency, because the two read-only views
      and the panel's static directory need hass.http to exist before async_setup
      runs, and frontend and panel_custom as after_dependencies, because the
      sidebar entry needs them set up first where they are going to be set up at
      all while the HTTP surface works perfectly well on a Home Assistant with no
      frontend installed.
  docs-actions:
    status: done
    comment: >-
      docs/integration.md documents all five actions -- the four cook-along ones and
      set_shopping_list -- their fields and what each refuses to do, in the same
      plain language as the rest of that file. Note that hassfest fails an
      integration that registers an action with no services.yaml entry, so those two
      files always move together.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
    comment: docs/integration.md opens with what it does and for whom.
  docs-installation-instructions:
    status: done
    comment: docs/integration.md covers both HACS and manual installation.
  docs-removal-instructions:
    status: done
    comment: >-
      docs/integration.md says what deleting the entry does and does not touch --
      notably that recipe files are the user's own and are never removed, and that
      the repair notices go with the entry.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: >-
      There is no external event stream. RecipeWizardEntity subclasses
      CoordinatorEntity, which owns the library subscription. Both platforms add
      their own on top through async_on_remove: the sensors subscribe to the cursor,
      and the todo platform's async_added_to_hass calls super() first and only then
      reads its store.
  entity-unique-id:
    status: done
    comment: >-
      entity.py sets it to the config entry id plus a key written in code, so
      moving or renaming the recipe directory -- the one thing the user configures
      -- does not orphan every dashboard card pointing at these entities. The
      reconfigure flow is what makes that reachable, and
      test_reconfiguring_keeps_the_entities_a_dashboard_points_at holds it.
  has-entity-name:
    status: done
    comment: >-
      _attr_has_entity_name is set once, on the base entity in entity.py, and every
      entity takes its visible name from a translation key.
  runtime-data:
    status: done
    comment: >-
      entry.runtime_data holds a RecipeWizardData dataclass. hass.data[DOMAIN] is
      not used anywhere.
  test-before-configure:
    status: done
    comment: >-
      The config flow loads the library in the executor and reports four distinct
      failures -- missing directory, no recipes, unreadable food bank, a document
      that will not parse -- each with its own message. The reconfigure step runs
      the same check through the same helper, so a folder that will not load
      cannot be stored over one that does.
  test-before-setup:
    status: done
    comment: >-
      async_config_entry_first_refresh raises ConfigEntryNotReady, so a directory
      that has gone missing retries instead of loading an entry with no library.
  unique-config-entry:
    status: done
    comment: >-
      single_config_entry is true in the manifest. There is one recipe library, so
      a second entry could only ever be a duplicate; Home Assistant aborts the
      second flow itself with single_instance_allowed. It exempts
      SOURCE_RECONFIGURE from that abort, which is what lets the one entry be
      pointed at another folder.

  # --- Silver ---------------------------------------------------------------
  action-exceptions:
    status: done
    comment: >-
      ServiceValidationError for everything a cook can fix -- a name matching no
      recipe, a name matching three (the message names them), moving with nothing on
      the go, stepping back from the first step -- and HomeAssistantError for a
      document that will not resolve or a library that is not loaded. Every message
      is a translation key naming the recipe or the position it is about. Editing
      the wording of a computed to-do item raises rather than accepting a change the
      next refresh would discard.
  config-entry-unloading:
    status: done
    comment: >-
      async_unload_entry forwards the unload. The library is plain objects and
      polling stops with the last listener, so the only thing with a life of its
      own is the cook-along's wake-up: cursor.py arms one
      async_track_point_in_time at the current step's estimate, and registers the
      cancel through entry.async_on_unload rather than the unsubscribe itself,
      because that unsubscribe is replaced every time the cursor moves.
      Repair notices are cleared in async_remove_entry and deliberately not on
      unload, since a reload is an unload.
  docs-configuration-parameters:
    status: done
    comment: >-
      There is one setting, the recipe folder, and docs/integration.md documents
      it, including how to change it afterwards. There is no options flow.
  docs-installation-parameters:
    status: done
    comment: docs/integration.md walks the single setup field.
  entity-unavailable:
    status: done
    comment: >-
      UpdateFailed carries the reason, so CoordinatorEntity handles the library
      going away for every entity. Each platform adds one condition of its own: a
      shopping target that no longer resolves makes that list unavailable rather
      than showing the last good answer, while a recipe deleted from under a running
      cook-along reports unknown with a problem attribute -- there the library is
      fine and only the position is not.
  integration-owner:
    status: done
    comment: codeowners is set in the manifest.
  log-when-unavailable:
    status: done
    comment: >-
      DataUpdateCoordinator logs the failure once and the recovery once; the
      integration adds no duplicate logging of its own.
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 in both sensor.py and todo.py. Every read is served from
      the library the coordinator has already loaded and the cook-along the cursor
      has already resolved, so there is nothing to serialise. Any later platform
      module needs the same line.
  reauthentication-flow:
    status: exempt
    comment: There are no credentials. Nothing can expire or be revoked.
  test-coverage:
    status: done
    comment: >-
      tests_ha covers the glue, the loader, the flow, both cook-along sensors, the
      shopping list and all five actions -- including that no property touches the
      library, that the dish is resolved once for a cursor that only moves, and that
      both the cursor and a half-done shopping trip survive a restart. The four
      rules closed most recently have files of their own: test_issues.py,
      test_diagnostics.py, test_icons.py, and the reconfigure half of
      test_config_flow.py. test_http.py covers the two views and the panel: that a
      URN with a slash in it reaches the route, that neither view answers without a
      login, that nothing is resolved on the event loop, and that a checkout with no
      frontend bundle in it still gets its sensors and its shopping list.

  # --- Gold -----------------------------------------------------------------
  devices:
    status: exempt
    comment: >-
      Nothing here is a device. The integration reads local documents, which is
      why integration_type is service.
  diagnostics:
    status: done
    comment: >-
      diagnostics.py redacts nothing, because it gathers nothing that would need
      it: counts, the recipe folder, the entry's own settings, the cook-along as a
      position, and every validator finding as level, code, recipe and node. Recipe
      content is out -- step text and finding messages especially, since a message
      is prose built by interpolating strings out of the document. What cannot be
      excluded is said out loud in the module and in the tests: a semantic id is
      made of an ingredient's name, and the id is in scope.
  discovery:
    status: exempt
    comment: A directory of files on the host cannot be discovered on a network.
  discovery-update-info:
    status: exempt
    comment: Nothing is discovered, so there is no discovery information to update.
  docs-data-update:
    status: done
    comment: >-
      docs/integration.md explains the 15-minute scan and that only changed files
      are re-read.
  docs-examples:
    status: done
    comment: >-
      docs/integration.md carries a cook-along dashboard card over the sensor's
      attributes, an automation that announces a step's estimated timer, the
      set_shopping_list action as YAML for a dashboard button, and what each kind of
      shopping line means against the doubled vanilla cake.
  docs-known-limitations:
    status: done
    comment: >-
      docs/integration.md lists them, including that recipes must be edited
      outside Home Assistant.
  docs-supported-devices:
    status: exempt
    comment: No devices.
  docs-supported-functions:
    status: done
    comment: >-
      docs/integration.md lists both sensors, every attribute worth reading, the
      shopping list entity, all five actions, and the Recipes page in the sidebar
      -- what it shows, that it is optional, and that everything on it is also
      available as the entities a hand-built dashboard already uses.
  docs-troubleshooting:
    status: done
    comment: >-
      docs/integration.md maps each setup error to what to do about it, has a
      section on the repair notice a broken recipe raises, and says what to do
      when Recipes is missing from the sidebar -- which is a half-copied install
      rather than a fault, and is why the log line names the file.
  docs-use-cases:
    status: done
    comment: docs/integration.md opens with the cook-along and the shopping list.
  dynamic-devices:
    status: exempt
    comment: No devices.
  entity-category:
    status: exempt
    comment: >-
      Neither sensor is diagnostic or configuration. The cook-along is what the
      integration is for, so filing it under a category would hide the primary
      surface behind a disclosure triangle.
  entity-device-class:
    status: done
    comment: >-
      The step timer is a timestamp, which is what makes a dashboard render it as a
      countdown. The current step has no applicable class -- there is no device
      class for "which page of a recipe" -- and inventing one would be worse than
      none.
  entity-disabled-by-default:
    status: exempt
    comment: >-
      Three entities, and all three are the point. The rule exists for noisy or
      expensive entities; these cost one already-loaded library between them.
  entity-translations:
    status: done
    comment: >-
      Every entity sets a translation_key and strings.json carries the entity block
      -- sensor.current_step, sensor.step_timer, todo.shopping_list. No name is
      written in Python.
  exception-translations:
    status: done
    comment: >-
      RecipeLibraryError passes translation_domain and translation_key, and
      strings.json carries the matching exceptions block.
  icon-translations:
    status: done
    comment: >-
      One icons.json holds both platforms' entity keys and all five actions,
      including the entity service the todo platform registers -- the two are
      registered in different places and there is one file, which is what the rule
      is for. current_step also takes state icons for idle and finished, the two
      states that are words rather than a position. tests_ha/test_icons.py compares
      the file against the entity registry and the registered actions in both
      directions, so a platform or an action added without an icon fails rather
      than rendering as a generic dot nobody notices.
  reconfiguration-flow:
    status: done
    comment: >-
      async_step_reconfigure in config_flow.py, sharing _async_checked_directory
      with the user step so both run the same load-in-the-executor check and
      produce the same five error keys. It writes with data_updates and reloads,
      which keeps entry_id -- and therefore every unique_id, dashboard card and
      automation -- along with the cook-along position in entry.options and the
      shopping list's ticks. Moving the recipe folder used to mean deleting the
      entry and re-adding it, which threw all of that away.
  repair-issues:
    status: done
    comment: >-
      issues.py raises one non-fixable card per document the validator reports
      *errors* on, naming the recipe and listing every node a fix goes on. Warnings
      never raise one and that is the whole design: a warning here is frequently the
      correct outcome for a source that says "a splash of milk", and a card nobody
      can clear teaches people to dismiss the ones that matter. It is not fixable
      because the fix is an edit to a document the integration only ever reads.
      Raised after a successful reload, withdrawn from the registry when the
      finding goes, and swept in async_remove_entry.
  stale-devices:
    status: exempt
    comment: No devices.

  # --- Platinum -------------------------------------------------------------
  async-dependency:
    status: exempt
    comment: >-
      The resolver is synchronous stdlib file I/O on purpose -- it is also a CLI
      and an enrichment tool. Every call from the integration goes through
      hass.async_add_executor_job, so the event loop is never blocked; this is the
      accepted ceiling.
  inject-websession:
    status: exempt
    comment: >-
      The integration makes no HTTP requests at runtime. It *serves* two read-only
      views to the Recipes page, which is Home Assistant's own aiohttp application
      and not a session this integration owns. Importing a recipe from a URL is a
      command-line operation outside Home Assistant.
  strict-typing:
    status: done
    comment: >-
      core/py.typed marks the vendored library as typed, and `python -m mypy` runs
      over the whole package from pyproject.toml with its own CI job. The
      integration modules are strict and clean. core/ is checked but not strictly:
      the four strictness axes it fails are switched off with their reasons, and
      four of its modules carry pre-existing annotation defects silenced by error
      code -- one of them real (batch_yield_grams still declares list[str] and
      returns list[Finding]) and left for a change that owns core/. That block is
      the honest remainder of this rule and should only ever shrink.

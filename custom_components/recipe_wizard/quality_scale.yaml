# Where this integration stands against the Home Assistant quality scale.
#
# `manifest.json` deliberately does not declare `quality_scale`: Home Assistant
# reports every custom integration as "custom" regardless (see
# `loader.Integration.quality_scale`), so a declaration here would be a claim
# nothing checks. hassfest skips this file for custom integrations for the same
# reason, but the file is written to hassfest's real schema anyway -- every rule
# in every tier is listed, every exemption carries its reason, and nothing is
# blank -- so that it stays reviewable and would validate unchanged if this ever
# moved into core.
#
# The two structural ceilings, stated once so no rule below has to argue them:
#
# * There are no devices. The integration reads a directory of documents, so
#   every device and discovery rule is genuinely not applicable rather than
#   skipped, and `integration_type` is `service`.
# * The library is synchronous. `core/` is a stdlib-only resolver doing file I/O,
#   which is the right shape for something a CLI and an enrichment loop also use.
#   Every call from the integration goes through `hass.async_add_executor_job`,
#   and Platinum's `async-dependency` is the accepted price.
#
# Both platforms are in place -- the cook-along sensors and the shopping list -- so
# the entity and action rules below are answered rather than deferred. What is left
# is listed honestly: brands needs an asset nobody has drawn, icons need one shared
# icons.json holding both platforms' keys, and reconfiguration is a real gap.
# The sensor platform and the four cook-along actions are in place, so the entity
# and action rules below are answered rather than deferred. What is left is listed
# honestly: brands needs an asset nobody has drawn, icons need one shared
# icons.json that every platform's keys go in, and reconfiguration is a real gap.

rules:
  # --- Bronze ---------------------------------------------------------------
  action-setup:
    status: done
    comment: >-
      The four cook-along actions register in async_setup (actions.py, called from
      __init__.py), not async_setup_entry, so an automation calling one while the
      entry is retrying is told the entry is not loaded rather than that the action
      does not exist. Each handler resolves the one loaded entry itself.
  appropriate-polling:
    status: done
    comment: >-
      15 minutes. Recipes are added and enriched outside Home Assistant, so
      polling is what stops a new recipe needing a restart; the interval only
      stats the documents and parses solely when an mtime has moved
      (loader.library_fingerprint).
  brands:
    status: todo
    comment: >-
      Needs an icon.png and a pull request to home-assistant/brands. No asset has
      been invented for it.
  common-modules:
    status: done
    comment: >-
      The coordinator is in coordinator.py, shared loading in loader.py, and the
      base entity in entity.py -- which owns the unique-id scheme and the one
      service device, so neither platform invents its own.
      The coordinator is in coordinator.py, shared loading in loader.py, and the
      base entity in entity.py -- which owns the unique-id scheme and the one
      service device, so no platform invents its own.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: >-
      tests_ha/test_config_flow.py covers the form, the created entry, the
      relative-path case, each of the five error keys, recovery after an error,
      and the single-entry abort.
  dependency-transparency:
    status: done
    comment: >-
      requirements is empty. The resolver is vendored at
      custom_components/recipe_wizard/core/ and is stdlib-only, so there is no
      third-party code to be transparent about.
  docs-actions:
    status: done
    comment: >-
      docs/integration.md documents all five actions -- the four cook-along ones and
      set_shopping_list -- their fields and what each refuses to do, in the same
      plain language as the rest of that file. Note that hassfest fails an
      integration that registers an action with no services.yaml entry, so those two
      files always move together.
    status: done
    comment: >-
      docs/integration.md documents all four actions, their fields and what each
      refuses to do, in the same plain language as the rest of that file.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
    comment: docs/integration.md opens with what it does and for whom.
  docs-installation-instructions:
    status: done
    comment: docs/integration.md covers both HACS and manual installation.
  docs-removal-instructions:
    status: done
    comment: >-
      docs/integration.md says what deleting the entry does and does not touch --
      notably that recipe files are the user's own and are never removed.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: >-
      There is no external event stream. RecipeWizardEntity subclasses
      CoordinatorEntity, which owns the library subscription. Both platforms add
      their own on top through async_on_remove: the sensors subscribe to the cursor,
      and the todo platform's async_added_to_hass calls super() first and only then
      reads its store.
  entity-unique-id:
    status: done
    comment: >-
      entity.py sets it to the config entry id plus a key written in code, so
      moving or renaming the recipe directory -- the one thing the user configures
      -- does not orphan every dashboard card pointing at these entities.
  has-entity-name:
    status: done
    comment: >-
      _attr_has_entity_name is set once, on the base entity in entity.py, and every
      entity takes its visible name from a translation key.
      There is no external event stream. RecipeWizardEntity subclasses
      CoordinatorEntity, which owns the library subscription, and the cook-along
      sensors add their cursor subscription in async_added_to_hass through
      async_on_remove.
  entity-unique-id:
    status: done
    comment: >-
      entry_id plus a key written in code ("current_step", "step_timer"), so moving
      the recipe folder does not orphan every dashboard card pointing at them.
  has-entity-name:
    status: done
    comment: _attr_has_entity_name is set once, on the base entity in entity.py.
  runtime-data:
    status: done
    comment: >-
      entry.runtime_data holds a RecipeWizardData dataclass. hass.data[DOMAIN] is
      not used anywhere.
  test-before-configure:
    status: done
    comment: >-
      The config flow loads the library in the executor and reports four distinct
      failures -- missing directory, no recipes, unreadable food bank, a document
      that will not parse -- each with its own message.
  test-before-setup:
    status: done
    comment: >-
      async_config_entry_first_refresh raises ConfigEntryNotReady, so a directory
      that has gone missing retries instead of loading an entry with no library.
  unique-config-entry:
    status: done
    comment: >-
      single_config_entry is true in the manifest. There is one recipe library, so
      a second entry could only ever be a duplicate; Home Assistant aborts the
      second flow itself with single_instance_allowed.

  # --- Silver ---------------------------------------------------------------
  action-exceptions:
    status: done
    comment: >-
      ServiceValidationError for everything a cook can fix -- a name matching no
      recipe, a name matching three (the message names them), moving with nothing on
      the go, stepping back from the first step -- and HomeAssistantError for a
      document that will not resolve or a library that is not loaded. Every message
      is a translation key naming the recipe or the position it is about. Editing
      the wording of a computed to-do item raises rather than accepting a change the
      next refresh would discard.
      ServiceValidationError for what a cook can fix -- a recipe id that matches
      nothing or matches three, moving with nothing on the go, stepping back from
      the first step -- and HomeAssistantError for a document that will not
      resolve. Every message is a translation key in strings.json and names the
      recipe or the position it is about.
  config-entry-unloading:
    status: done
    comment: >-
      async_unload_entry forwards the unload. Nothing else needs tearing down --
      the library is plain objects and polling stops with the last listener.
  docs-configuration-parameters:
    status: done
    comment: >-
      There is one setting, the recipe folder, and docs/integration.md documents
      it. There is no options flow.
  docs-installation-parameters:
    status: done
    comment: docs/integration.md walks the single setup field.
  entity-unavailable:
    status: done
    comment: >-
      UpdateFailed carries the reason, so CoordinatorEntity handles the library
      going away for every entity. Each platform adds one condition of its own: a
      shopping target that no longer resolves makes that list unavailable rather
      than showing the last good answer, while a recipe deleted from under a running
      cook-along reports unknown with a problem attribute -- there the library is
      fine and only the position is not.
      Both sensors are CoordinatorEntity subclasses, so a library that will not
      load makes them unavailable with UpdateFailed's reason attached. A recipe
      deleted from under a running cook-along is different and reports unknown with
      a problem attribute, because the library is fine and the position is not.
  integration-owner:
    status: done
    comment: codeowners is set in the manifest.
  log-when-unavailable:
    status: done
    comment: >-
      DataUpdateCoordinator logs the failure once and the recovery once; the
      integration adds no duplicate logging of its own.
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 in both sensor.py and todo.py. Every read is served from
      the library the coordinator has already loaded and the cook-along the cursor
      has already resolved, so there is nothing to serialise. Any later platform
      module needs the same line.
      PARALLEL_UPDATES = 0 in sensor.py. Every read is served from the library the
      coordinator has already loaded and the cook-along the cursor has already
      resolved, so there is nothing to serialise.
  reauthentication-flow:
    status: exempt
    comment: There are no credentials. Nothing can expire or be revoked.
  test-coverage:
    status: done
    comment: >-
      tests_ha covers the glue, the loader, the flow, both cook-along sensors, the
      shopping list and all five actions -- including that no property touches the
      library, that the dish is resolved once for a cursor that only moves, and that
      both the cursor and a half-done shopping trip survive a restart.
      tests_ha covers the glue, the loader, the flow, both cook-along sensors and
      all four actions -- including that no property touches the library, that the
      dish is resolved once for a cursor that only moves, and that the cursor
      survives an unload and set-up again.

  # --- Gold -----------------------------------------------------------------
  devices:
    status: exempt
    comment: >-
      Nothing here is a device. The integration reads local documents, which is
      why integration_type is service.
  diagnostics:
    status: todo
    comment: >-
      Worth having, and it must redact nothing sensitive -- recipe files are the
      user's own content and a diagnostics dump should stay to counts, paths and
      validator findings.
  discovery:
    status: exempt
    comment: A directory of files on the host cannot be discovered on a network.
  discovery-update-info:
    status: exempt
    comment: Nothing is discovered, so there is no discovery information to update.
  docs-data-update:
    status: done
    comment: >-
      docs/integration.md explains the 15-minute scan and that only changed files
      are re-read.
  docs-examples:
    status: done
    comment: >-
      docs/integration.md carries a cook-along dashboard card over the sensor's
      attributes, an automation that announces a step's estimated timer, the
      set_shopping_list action as YAML for a dashboard button, and what each kind of
      shopping line means against the doubled vanilla cake.
      docs/integration.md carries a cook-along dashboard card over the sensor's
      attributes and an automation that announces a step's estimated timer.
  docs-known-limitations:
    status: done
    comment: >-
      docs/integration.md lists them, including that recipes must be edited
      outside Home Assistant.
  docs-supported-devices:
    status: exempt
    comment: No devices.
  docs-supported-functions:
    status: done
    comment: >-
      docs/integration.md lists both sensors, every attribute worth reading, the
      shopping list entity, and all five actions.
    status: done
    comment: >-
      docs/integration.md lists both sensors, every attribute worth reading, and
      the four actions.
  docs-troubleshooting:
    status: done
    comment: docs/integration.md maps each setup error to what to do about it.
  docs-use-cases:
    status: done
    comment: docs/integration.md opens with the cook-along and the shopping list.
  dynamic-devices:
    status: exempt
    comment: No devices.
  entity-category:
    status: exempt
    comment: >-
      Neither sensor is diagnostic or configuration. The cook-along is what the
      integration is for, so filing it under a category would hide the primary
      surface behind a disclosure triangle.
  entity-device-class:
    status: done
    comment: >-
      The step timer is a timestamp, which is what makes a dashboard render it as a
      countdown. The current step has no applicable class -- there is no device
      class for "which page of a recipe" -- and inventing one would be worse than
      none.
  entity-disabled-by-default:
    status: exempt
    comment: >-
      Two entities, and both are the point. The rule exists for noisy or expensive
      entities; these cost one already-loaded library between them.
  entity-translations:
    status: done
    comment: >-
      Every entity sets a translation_key and strings.json carries the entity block
      -- sensor.current_step, sensor.step_timer, todo.shopping_list. No name is
      written in Python.
      Both sensors set a translation_key and strings.json carries the entity block.
      No name is written in Python.
  exception-translations:
    status: done
    comment: >-
      RecipeLibraryError passes translation_domain and translation_key, and
      strings.json carries the matching exceptions block.
  icon-translations:
    status: todo
    comment: >-
      Needs one icons.json holding every platform's entity keys and every action,
      so it is written once when the platforms are all in rather than merged from
      two half-files.
  reconfiguration-flow:
    status: todo
    comment: >-
      A real gap rather than a formality -- moving the recipe folder should not
      mean deleting and re-adding the integration.
  repair-issues:
    status: todo
    comment: >-
      The obvious candidate is a repair for a document the validator reports
      errors on, which is more useful than a log line nobody reads.
  stale-devices:
    status: exempt
    comment: No devices.

  # --- Platinum -------------------------------------------------------------
  async-dependency:
    status: exempt
    comment: >-
      The resolver is synchronous stdlib file I/O on purpose -- it is also a CLI
      and an enrichment tool. Every call from the integration goes through
      hass.async_add_executor_job, so the event loop is never blocked; this is the
      accepted ceiling.
  inject-websession:
    status: exempt
    comment: >-
      The integration makes no HTTP requests at runtime. Importing a recipe from a
      URL is a command-line operation outside Home Assistant.
  strict-typing:
    status: todo
    comment: >-
      The integration is annotated throughout but there is no py.typed marker on
      the vendored library and no mypy run in CI yet.
